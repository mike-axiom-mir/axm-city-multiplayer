name: Integration Python diagnostics

on:
  pull_request:
    paths:
      - "axm_p2p/**"
      - "tests/**"
      - ".github/workflows/integration-python-diagnostics.yml"

permissions:
  contents: read

jobs:
  capability-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m unittest discover -s tests -p 'test_capability_registry.py' -v
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m unittest discover -s tests -p 'test_cli.py' -v
