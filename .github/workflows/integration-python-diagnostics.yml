        with: {python-version: "3.11"}
      - run: python -m unittest discover -s tests -p 'test_p2p.py' -v
  pending:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m unittest discover -s tests -p 'test_pending_handshake_bounds.py' -v
