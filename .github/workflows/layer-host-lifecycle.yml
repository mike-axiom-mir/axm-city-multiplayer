name: P2P layer host lifecycle

on:
  pull_request:
    paths:
      - "axm_p2p/layer.py"
      - "tests/test_layer.py"
      - ".github/workflows/layer-host-lifecycle.yml"

permissions:
  contents: read

jobs:
  layer-lifecycle:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile reference core
        run: python -m compileall -q axm_p2p tests
      - name: Run complete reference suite
        run: python -m unittest discover -s tests -v
