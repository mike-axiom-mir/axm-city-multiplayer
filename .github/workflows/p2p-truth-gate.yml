name: P2P truth gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  direct-invite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile reference core
        run: python -m compileall -q axm_p2p tests
      - name: Run direct-invite verification suite
        run: python -m unittest discover -s tests -v
