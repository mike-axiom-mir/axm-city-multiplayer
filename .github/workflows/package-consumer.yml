name: Package consumer gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package-consumer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from checkout without runtime dependencies
        run: python -m pip install --no-deps --no-build-isolation .
      - name: Verify installed import and both CLI entry points
        working-directory: ${{ runner.temp }}
        run: |
          python -c "from axm_p2p import AXMP2PLayer; assert AXMP2PLayer"
          python -m axm_p2p --help
          axm-p2p --help
      - name: Run reference and consumer tests
        run: python -m unittest discover -s tests -v
