name: P2P contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile reference implementation and tests
        run: python -m compileall -q axm_p2p tests
      - name: Run P2P contract suite
        run: python -m unittest discover -s tests -v
